version: '3.8'

services:
  app:
    build: .
    ports:
      - "9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/reservas_institucionales
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SESSION_STORE_TYPE=jdbc
    depends_on:
      - db
      - redis
    networks:
      - reservas-network

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"  # Expones el 5432 interno como 5433 en tu máquina
    environment:
      - POSTGRES_DB=reservas_institucionales
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reservas-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reservas-network

volumes:
  postgres_data:
  redis_data:

networks:
  reservas-network:
    driver: bridge
